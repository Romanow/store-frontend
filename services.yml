x-common-envs: &common-envs
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker,auth0}
  OAUTH2_SECURITY_ENABLED: ${OAUTH2_SECURITY_ENABLED:-true}

version: "3.9"
services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 'postgres'
      POSTGRES_DB: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/

  gateway:
    image: romanowalex/store-gateway:v4.3
    container_name: gateway
    restart: on-failure
    environment:
      <<: *common-envs
      OAUTH2_SUCCESS_REDIRECT_URI: ${OAUTH2_SUCCESS_REDIRECT_URI:-http://localhost:3000}
    healthcheck:
      test: ['CMD', 'curl', '--silent', '--fail', 'http://localhost:8080/manage/health']
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

  store-service:
    image: romanowalex/store-service:v4.3
    container_name: store
    restart: on-failure
    environment:
      <<: *common-envs
    healthcheck:
      test: ['CMD', 'curl', '--silent', '--fail', 'http://localhost:8180/manage/health']
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      - '8180:8180'
    depends_on:
      postgres:
        condition: service_healthy

  warehouse-service:
    image: romanowalex/warehouse-service:v4.3
    container_name: warehouse
    restart: on-failure
    environment:
      <<: *common-envs
    healthcheck:
      test: ['CMD', 'curl', '--silent', '--fail', 'http://localhost:8280/manage/health']
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      - '8280:8280'
    depends_on:
      postgres:
        condition: service_healthy

  warranty-service:
    image: romanowalex/warranty-service:v4.2
    container_name: warranty
    restart: on-failure
    environment:
      <<: *common-envs
    healthcheck:
      test: ['CMD', 'curl', '--silent', '--fail', 'http://localhost:8380/manage/health']
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      - '8380:8380'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
